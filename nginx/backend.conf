server {
    listen 80;
    server_name backend.v0.youare-invited.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Override X-Forwarded-Host so Django's USE_X_FORWARDED_HOST check
        # always sees the correct backend domain, not any upstream proxy's
        # internal hostname (e.g. localhost:3001 from Next.js dev rewrites).
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}
