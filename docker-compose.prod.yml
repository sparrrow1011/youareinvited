version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: youareinvited-postgres
    environment:
      POSTGRES_DB: youareinvited
      POSTGRES_USER: youareinvited
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youareinvited"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youareinvited-backend
    environment:
      DIGITALOCEAN: "True"
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://youareinvited:${DB_PASSWORD}@postgres:5432/youareinvited?sslmode=disable
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      BACKEND_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      USE_S3_STORAGE: ${USE_S3_STORAGE:-False}
      SUPER_ADMIN_ORIGIN: ${SUPER_ADMIN_ORIGIN:-}
    # Bind to localhost only — nginx handles public traffic
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn api.wsgi:app --bind 0.0.0.0:8000 --workers 4 --timeout 60"
    restart: unless-stopped

  # Frontend runs on Vercel — not deployed to this Droplet.
  # Only postgres + backend run here.

volumes:
  postgres_data:
  static_files:
  media_files:

networks:
  default:
    name: youareinvited-network
